name: Publish demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test -f public/data/meta.json || (echo "Run infra/export_static.py and commit web/public/data first." && exit 1)
      - run: npm ci
      - run: npx ng build --configuration static --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages serves 404.html for unknown paths, so /ask still loads the app.
      - run: cp dist/web/browser/index.html dist/web/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
